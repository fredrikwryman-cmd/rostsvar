        - article [ref=e37]:
          - heading "Custom Keyboard Extensions Can Disappear in iOS 17" [level=1] [ref=e38]
          - generic [ref=e39]:
            - generic [ref=e40]: Feb 12, 2024
            - generic [ref=e41]: ·3 min read
            - generic [ref=e42]:
              - text: ·
              - generic [ref=e43]: apple-bugs
          - paragraph [ref=e44]: People have started reporting that their custom keyboard extensions have disappeared in iOS 17. This article discusses some concerning findings after investigating this problem.
          - paragraph [ref=e45]: Some KeyboardKit users have also reported this problem. When it happens, the keyboard no longer shows up in System Settings or the keyboard switcher.
          - paragraph [ref=e46]: While investigating the problem, some devices that previously have enabled the keyboard still show it as enabled in the main app, while it doesn’t show up anywhere else.
          - heading "Bundle ID" [level=2] [ref=e47]
          - paragraph [ref=e48]:
            - text: The problem only seems to affect a small number of apps, and all we have investigated so far have had a bundle identifier that didn’t start with
            - code [ref=e49]: com.
          - paragraph [ref=e50]: To investigate this further, we created a suite of test apps where the only difference was the bundle identifier, then added a custom keyboard extension to each app.
          - paragraph [ref=e51]: "After some extensive testing in multiple test apps, this was the result:"
          - list [ref=e52]:
            - listitem [ref=e53]:
              - text: Bundle ID starts with
              - code [ref=e54]: com.
              - text: "- the keyboard shows up."
            - listitem [ref=e55]:
              - text: Bundle ID starts with
              - code [ref=e56]: eu.
              - text: "- the keyboard shows up."
            - listitem [ref=e57]:
              - text: Bundle ID starts with
              - code [ref=e58]: se.
              - text: "- the keyboard doesn’t show up."
            - listitem [ref=e59]:
              - text: Bundle ID starts with
              - code [ref=e60]: de.
              - text: "- the keyboard shows up."
            - listitem [ref=e61]:
              - text: Bundle ID starts with
              - code [ref=e62]: da.
              - text: "- the keyboard shows up."
            - listitem [ref=e63]:
              - text: Bundle ID starts with
              - code [ref=e64]: dk.
              - text: "- the keyboard shows up."
          - paragraph [ref=e65]:
            - text: The
            - code [ref=e66]: com.
            - text: prefix is by far the most common bundle ID prefix, while
            - code [ref=e67]: eu.
            - text: is quite common within the European Union. The problem had been much more severe if it affected these IDs.
          - paragraph [ref=e68]:
            - text: The
            - code [ref=e69]: se.
            - text: prefix is however common in Swedish apps, where
            - code [ref=e70]: se
            - text: is the Swedish top domain. As such, some Swedish companies use this prefix in their bundle ID.
          - paragraph [ref=e71]:
            - text: We could reproduce the problem by creating many test apps with the
            - code [ref=e72]: se.
            - text: bundle ID prefix, and see that the keyboard didn’t show up for any of these apps.
          - paragraph [ref=e73]:
            - text: If we adjusted the bundle ID of the app and keyboard to start with
            - code [ref=e74]: com.
            - text: instead of
            - code [ref=e75]: se.
            - text: ", it worked."
          - heading "Locale?" [level=2] [ref=e76]
          - paragraph [ref=e77]:
            - text: Since
            - code [ref=e78]: se
            - text: is both the Swedish top domain, as well as the Swedish locale identifier’s region code, we first suspected that the problem could be locale-related.
          - paragraph [ref=e79]:
            - text: We therefore tried changing the prefix from
            - code [ref=e80]: se
            - text: to
            - code [ref=e81]: de
            - text: (German) as well as
            - code [ref=e82]: da
            - text: and
            - code [ref=e83]: dk
            - text: (Denmark), but the keyboard worked perfectly for all these cases.
          - heading "Conclusion" [level=2] [ref=e84]
          - paragraph [ref=e85]:
            - text: The problem seems to be related to the bundle ID, but the only case we have found so far is if the bundle ID starts with
            - code [ref=e86]: se.
            - text: .
          - paragraph [ref=e87]: We have reported this problem to the Feedback Assistant. Please let us know if you also experience this problem, so that we can provide Apple with more information.
          - paragraph [ref=e88]: Since this is a critical bug for any apps it affects, we hope to find a way to solve or work around this problem. When we do, we’ll share it here.
          - paragraph [ref=e89]:
            - text: If you want to refer to the feedback in the Apple Feedback Assistant, please use the ID
            - code [ref=e90]: FB13611131
            - text: .
          - heading "Discussions & More" [level=2] [ref=e91]
          - paragraph [ref=e92]:
            - text: If you found this interesting, please share your thoughts on
            - link "Bluesky" [ref=e93] [cursor=pointer]:
              - /url: https://bsky.app/profile/keyboardkit.bsky.social
            - text: and
            - link "Mastodon" [ref=e94] [cursor=pointer]:
              - /url: https://techhub.social/@keyboardkit/111919132611882137
            - text: . Make sure to follow to be notified when new content is published.
