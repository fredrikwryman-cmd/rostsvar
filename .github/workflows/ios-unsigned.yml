name: Bygg Tap & Talk för iPhone (osignerat)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Samma fasta Xcode i båda flödena. Byt bara på ett ställe per fil, och
  # kontrollera att samma version står i ios-testflight.yml.
  XCODE_VERSION: "26.2"
  MIN_IOS_SDK: "26"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Välj och kontrollera Xcode och iOS SDK
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "FEL: $app finns inte på byggaren. Tillgängliga Xcode-versioner:"
            ls -1 /Applications | grep -i '^Xcode' | sort -u
            exit 1
          fi
          sudo xcode-select -s "$app/Contents/Developer"
          sw_vers
          echo "--- Xcode ---"
          xcodebuild -version
          echo "--- iOS SDK:er ---"
          xcodebuild -showsdks | grep -iE 'ios' || true
          xcode=$(xcodebuild -version | head -1 | awk '{print $2}')
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Uppmätt: Xcode $xcode, iOS SDK $sdk"
          case "$xcode" in
            "$XCODE_VERSION"|"$XCODE_VERSION".*) ;;
            *) echo "FEL: bygget körde Xcode $xcode, inte $XCODE_VERSION."; exit 1 ;;
          esac
          if [ "${sdk%%.*}" -lt "$MIN_IOS_SDK" ]; then
            echo "FEL: iOS SDK $sdk är äldre än $MIN_IOS_SDK."
            exit 1
          fi
          echo "Godkänt: Xcode $xcode med iOS SDK $sdk."
          swift --version

      - name: Installera XcodeGen
        run: brew install xcodegen

      - name: Generera Xcode-projektet
        run: xcodegen generate

      - name: Visa måltavlor och byggvärden
        run: |
          xcodebuild -list -project Rostsvar.xcodeproj
          xcodebuild -project Rostsvar.xcodeproj -scheme Rostsvar \
            -showBuildSettings -configuration Release 2>/dev/null \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION|IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY' \
            | sort -u

      - name: Välj iPhone-simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))
          units = [d for group in data['devices'].values() for d in group if 'iPhone' in d['name']]
          if not units:
              raise SystemExit('Ingen tillgänglig iPhone-simulator')
          pick = sorted(units, key=lambda d: d['name'])[-1]
          print('Simulator:', pick['name'], pick['udid'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + pick['udid'] + '\n')
          PY

      # Loggen sparas med tee, men stegets status kommer från xcodebuild.
      # pipefail gör att tee inte kan dölja ett misslyckat testbygge, och
      # ingenting avslutas med "|| true".
      - name: Kör testerna
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Rostsvar.xcodeproj \
            -scheme Rostsvar \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/Rostsvar-tester.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild-test.log

      - name: Sammanfatta testerna
        if: always()
        run: |
          log=build/xcodebuild-test.log
          if [ ! -f "$log" ]; then
            echo "FEL: ingen testlogg skrevs."
            exit 1
          fi
          grep -E "^Test Suite .* (passed|failed)" "$log" | tail -3 || true
          grep -E "error:|XCTAssert.*failed" "$log" | sort -u | head -20 || true
          antal=$(grep -oE "Executed [0-9]+ test" "$log" | tail -1 | grep -oE "[0-9]+" || true)
          echo "Antal körda tester: ${antal:-0}"
          if [ "${antal:-0}" -lt 1 ]; then
            echo "FEL: inga tester kördes."
            exit 1
          fi

      - name: Bygg osignerat för iPhone
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Rostsvar.xcodeproj \
            -scheme Rostsvar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild-unsigned.log

      - name: Kontrollera ikoner och varningar
        run: |
          log=build/xcodebuild-unsigned.log
          fel=0
          # actool kallar platser den inte känner igen för "unassigned children".
          # Det fälls INTE längre. Den porten tvingade tidigare bort 27x20 och
          # 32x24, som App Store Connect sedan krävde. Det som räknas är vilka
          # storlekar som hamnar i tillägget, och det mäts i nästa steg.
          if grep -q "unassigned children" "$log"; then
            echo "Notis: actool rapporterar ozonerade platser i ikonuppsättningen."
            grep "unassigned children" "$log" | sort -u
          fi
          if grep -q "All interface orientations must be supported" "$log"; then
            echo "FEL: målet byggs för iPad. TARGETED_DEVICE_FAMILY ska vara 1."
            fel=1
          fi
          echo "Kvarvarande varningar i bygget:"
          grep "warning:" "$log" | grep -v "No AppIntents.framework" | sort -u | head -20
          exit $fel

      - name: Kontrollera att tillägget följde med
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/Rostsvar.app
          test -d "$app" || { echo "Appen byggdes inte"; exit 1; }
          ext="$app/PlugIns/RostsvarMessages.appex"
          test -d "$ext" || { echo "iMessage-tillägget saknas i appen"; ls -R "$app"; exit 1; }
          echo "Appen och tillägget finns:"
          ls "$app"
          ls "$ext"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ext/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$ext/Info.plist"
          echo "Visningsnamn (ska vara Tap & Talk):"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$ext/Info.plist"
          namn=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")
          if [ "$namn" != "Tap & Talk" ]; then
            echo "FEL: appens visningsnamn är \"$namn\", inte \"Tap & Talk\"."
            exit 1
          fi

      # Det enda som skyddar mot "Missing App Icon" vid uppladdning är att
      # storlekarna faktiskt ligger i tillägget. Mäts i det byggda paketet.
      - name: Kontrollera iMessage-ikonens storlekar i bygget
        run: |
          appex=build/DerivedData/Build/Products/Release-iphoneos/Rostsvar.app/PlugIns/RostsvarMessages.appex
          xcrun assetutil --info "$appex/Assets.car" > build/appex-assets.json 2>/dev/null || true
          python3 - "$appex" build/appex-assets.json <<'PY'
          import json, os, subprocess, sys
          appex, info = sys.argv[1], sys.argv[2]
          need = {(54, 40), (81, 60), (64, 48), (96, 72),
                  (120, 90), (180, 135), (134, 100), (148, 110), (1024, 768)}
          have = set()
          try:
              for item in json.load(open(info)):
                  if isinstance(item, dict) and "PixelWidth" in item:
                      have.add((item["PixelWidth"], item["PixelHeight"]))
          except Exception as problem:
              print("kunde inte lasa assetutil:", problem)
          for name in sorted(os.listdir(appex)):
              if name.endswith(".png"):
                  out = subprocess.run(
                      ["sips", "-g", "pixelWidth", "-g", "pixelHeight",
                       os.path.join(appex, name)],
                      capture_output=True, text=True).stdout
                  size = {}
                  for line in out.splitlines():
                      for key in ("pixelWidth", "pixelHeight"):
                          if key in line:
                              size[key] = int(line.split(":")[1])
                  if len(size) == 2:
                      have.add((size["pixelWidth"], size["pixelHeight"]))
          print("Storlekar i tillagget:", sorted(have))
          gap = sorted(need - have)
          if gap:
              print("FEL: dessa storlekar saknas i bygget:", gap)
              print('App Store Connect avvisar paketet med "Missing App Icon".')
              raise SystemExit(1)
          print("Alla", len(need), "kravda storlekar finns i tillagget.")
          PY

      - name: Paketera osignerad IPA
        run: |
          mkdir -p build/Package/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/Rostsvar.app \
                build/Package/Payload/Rostsvar.app
          cd build/Package && zip -qr ../Tap-and-Talk-unsigned.ipa Payload
          ls -lh ../Tap-and-Talk-unsigned.ipa

      - name: Ladda upp osignerad IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tap-and-Talk-osignerad-IPA
          path: ios/build/Tap-and-Talk-unsigned.ipa
          if-no-files-found: error

      - name: Ladda upp loggar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tap-and-Talk-bygglogg
          path: |
            ios/build/xcodebuild-unsigned.log
            ios/build/xcodebuild-test.log
            ios/build/Rostsvar-tester.xcresult
          if-no-files-found: ignore
