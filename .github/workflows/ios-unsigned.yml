name: Bygg Röstsvar för iPhone (osignerat)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Visa byggmiljön
        run: |
          sw_vers
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          swift --version

      - name: Installera XcodeGen
        run: brew install xcodegen

      - name: Generera Xcode-projektet
        run: xcodegen generate

      - name: Visa måltavlor och byggvärden
        run: |
          xcodebuild -list -project Rostsvar.xcodeproj
          xcodebuild -project Rostsvar.xcodeproj -scheme Rostsvar \
            -showBuildSettings -configuration Release 2>/dev/null \
            | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION|IPHONEOS_DEPLOYMENT_TARGET' \
            | sort -u

      - name: DIAGNOS tillfällig
        run: |
          echo "--- TARGETED_DEVICE_FAMILY ---"
          xcodebuild -project Rostsvar.xcodeproj -scheme Rostsvar \
            -showBuildSettings -configuration Release 2>/dev/null \
            | grep -E 'TARGETED_DEVICE_FAMILY' | sort -u

          src="Messages/Assets.xcassets/iMessage App Icon.stickersiconset"
          base='
            {"filename":"iphone-60x45@2x.png","idiom":"iphone","scale":"2x","size":"60x45"},
            {"filename":"iphone-60x45@3x.png","idiom":"iphone","scale":"3x","size":"60x45"},
            {"filename":"ipad-67x50@2x.png","idiom":"ipad","scale":"2x","size":"67x50"},
            {"filename":"ipad-74x55@2x.png","idiom":"ipad","scale":"2x","size":"74x55"},
            {"filename":"iphone-27x20@2x.png","idiom":"universal","scale":"2x","size":"27x20"},
            {"filename":"iphone-27x20@3x.png","idiom":"universal","scale":"3x","size":"27x20"},
            {"filename":"iphone-32x24@2x.png","idiom":"universal","scale":"2x","size":"32x24"},
            {"filename":"iphone-32x24@3x.png","idiom":"universal","scale":"3x","size":"32x24"}'

          probe () {
            name="$1"; extra="$2"
            dir="/tmp/$name.xcassets/iMessage App Icon.stickersiconset"
            rm -rf "/tmp/$name.xcassets"; mkdir -p "$dir"
            cp "$src"/*.png "$dir/"
            printf '{"images":[%s,%s],"info":{"author":"probe","version":1}}' "$base" "$extra" > "$dir/Contents.json"
            echo "===================== $name"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$dir/Contents.json" || return 0
            xcrun actool "/tmp/$name.xcassets" --compile "/tmp/$name-out" \
              --output-format human-readable-text --notices --warnings \
              --output-partial-info-plist "/tmp/$name.plist" \
              --app-icon 'iMessage App Icon' --include-sticker-content \
              --stickers-icon-role extension --development-region en \
              --target-device iphone --minimum-deployment-target 16.0 \
              --platform iphoneos 2>&1 | grep -viE '^/\*|^$' | head -20
            echo "--- genererad plist ---"
            plutil -p "/tmp/$name.plist" 2>/dev/null | head -30
          }

          mkdir -p /tmp
          probe P1 '{"filename":"Marketing-1024x1024.png","idiom":"ios-marketing","platform":"ios","scale":"1x","size":"1024x1024"},
                    {"filename":"Marketing-1024x768.png","idiom":"ios-marketing","platform":"ios","scale":"1x","size":"1024x768"}'
          probe P2 '{"filename":"Marketing-1024x1024.png","idiom":"universal","platform":"ios","size":"1024x1024"},
                    {"filename":"Marketing-1024x768.png","idiom":"universal","platform":"ios","size":"1024x768"}'
          probe P3 '{"filename":"Marketing-1024x1024.png","idiom":"ios-marketing","platform":"ios","scale":"1x","size":"1024x1024"},
                    {"filename":"Marketing-1024x768.png","idiom":"ios-marketing","scale":"1x","size":"1024x768"}'
          probe P4 '{"filename":"Marketing-1024x1024.png","idiom":"ios-marketing","platform":"ios","scale":"1x","size":"1024x1024"}'

      - name: Bygg osignerat för iPhone
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Rostsvar.xcodeproj \
            -scheme Rostsvar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild-unsigned.log

      - name: Kontrollera att tillägget följde med
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/Rostsvar.app
          test -d "$app" || { echo "Appen byggdes inte"; exit 1; }
          ext="$app/PlugIns/RostsvarMessages.appex"
          test -d "$ext" || { echo "iMessage-tillägget saknas i appen"; ls -R "$app"; exit 1; }
          echo "Appen och tillägget finns:"
          ls "$app"
          ls "$ext"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ext/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$ext/Info.plist"
          echo "Appikon i appens plist:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$app/Info.plist" || echo "saknas"

      - name: Paketera osignerad IPA
        run: |
          mkdir -p build/Package/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/Rostsvar.app \
                build/Package/Payload/Rostsvar.app
          cd build/Package && zip -qr ../Rostsvar-unsigned.ipa Payload
          ls -lh ../Rostsvar-unsigned.ipa

      - name: Ladda upp osignerad IPA
        uses: actions/upload-artifact@v4
        with:
          name: Rostsvar-osignerad-IPA
          path: ios/build/Rostsvar-unsigned.ipa
          if-no-files-found: error

      - name: Ladda upp bygglogg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rostsvar-bygglogg
          path: ios/build/xcodebuild-unsigned.log
          if-no-files-found: ignore
