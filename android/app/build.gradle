plugins { id 'com.android.application' version '8.9.2' }

android {
    namespace 'com.techrabbit.tapntalk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.techrabbit.tapntalk'
        minSdk 30
        targetSdk 35
        versionCode 10
        versionName '0.10'
    }
    // Enhetstesterna körs på en vanlig JVM, utan telefon och utan emulator.
    // Notices loggar felkoden med android.util.Log, och den klassen finns
    // bara som tom skalfil i android.jar: utan raden nedan kastar varje
    // anrop "not mocked" i stället för att göra ingenting.
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
