name: Rostsvar
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Rostsvar:
    type: application
    platform: iOS
    sources:
      # Typsnittet står på egen rad nedan, därför undantaget här: samma fil
      # två gånger i samma mål ger dubbla resurser i paketet.
      - path: App
        excludes:
          - Fonts
      # Archivo, typsnittet Tech Rabbit-designen är ritad i. Fyra vikter:
      # 400 brödtext, 700 rubriker och knappar, 800 etiketten under
      # Tala-knappen, 900 appnamnet.
      - path: App/Fonts
      # Guiden frågar om mikrofon och taligenkänning genom samma Dictation
      # som tilläggen använder, så att appen och tangentbordet säger samma
      # sak om samma tillstånd.
      - path: Shared/Dictation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.rostsvar.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tap & Talk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Mikrofonen används när du väljer Tala.
        NSSpeechRecognitionUsageDescription: Ditt tal görs om till ett textutkast.
        UILaunchScreen: {}
        # Filnamnen i paketets resursrot. PostScript-namnen, som
        # Font.custom frågar efter, står i Archivo-uppräkningen i
        # TechRabbit.swift och är avlästa ur filernas egna name-tabeller.
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Archivo-Black.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: RostsvarMessages
        embed: true
      - target: RostsvarKeyboard
        embed: true
    scheme:
      testTargets:
        - RostsvarTests
  RostsvarMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - Messages
      # Dikteringen är delad med tangentbordet, så rättningen av den gäller
      # båda tilläggen.
      - path: Shared/Dictation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.rostsvar.mobile.Messages
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Messages/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  RostsvarKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: Shared/Dictation.swift
      # Reglerna för hur tangentbordet skriver i andras fält, skilda från
      # tangentbordet för att kunna mätas av testerna.
      - path: Shared/Proxy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.rostsvar.mobile.Keyboard
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Keyboard/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  RostsvarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Messages/DraftState.swift
      - path: Shared/Dictation.swift
      # Dikteringsskärmens regler ligger skilda från skärmen just för att
      # kunna mätas här. Filen drar in Foundation och ingenting annat.
      - path: App/HomeState.swift
      - path: Shared/Proxy.swift
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: se.rostsvar.mobile.Tests
