name: Rostsvar
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
targets:
  Rostsvar:
    type: application
    platform: iOS
    sources:
      # Typsnittet står på egen rad nedan, därför undantaget här: samma fil
      # två gånger i samma mål ger dubbla resurser i paketet.
      - path: App
        excludes:
          - Fonts
      # Archivo, typsnittet Tech Rabbit-designen är ritad i. Fyra vikter:
      # 400 brödtext, 700 rubriker och knappar, 800 etiketten under
      # Tala-knappen, 900 appnamnet.
      - path: App/Fonts
      # Guiden frågar om mikrofon och taligenkänning genom samma Dictation
      # som tilläggen använder, så att appen och tangentbordet säger samma
      # sak om samma tillstånd.
      - path: Shared/Dictation.swift
      # Tech Rabbit-paletten. Ligger i Shared eftersom alla tre paketen ritar
      # med samma färger: appen genom TR, tilläggen som UIColor.
      - path: Shared/Palette.swift
      # Beskeden om taltjänsten. Samma mening på alla tre ytorna.
      - path: Shared/Notice.swift
      # Mått, radier, typskala och rörelsetider. Ligger i Shared av samma
      # skäl som Palette: tre mål, en uppsättning mått.
      - path: Shared/Theme.swift
      # Haptikkartan med sin spärr och sin av-knapp.
      - path: Shared/Haptics.swift
    settings:
      base:
        # Prefixet är com. och får aldrig bli se. igen. Ett paket-id som börjar
        # på se. gör att iOS inte visar tangentbordet under Lägg till nytt
        # tangentbord: tillägget installeras och signeras, men listan hoppar
        # tyst över det. Uppmätt av Kankoda (KeyboardKit) i testappar där bara
        # prefixet skilde: com., eu., de., da. och dk. visas, se. visas inte.
        # Anmält till Apple som FB13611131 och ännu inte rättat. se är också
        # språkkoden för nordsamiska, och samiska tangentbord kom i iOS 17.2,
        # där felet först dök upp. Ett tilläggs paket-id måste ligga under
        # appens, så alla tre flyttade samtidigt.
        PRODUCT_BUNDLE_IDENTIFIER: com.techrabbit.tapntalk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Tap&Talk"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Mikrofonen används när du väljer Tala.
        NSSpeechRecognitionUsageDescription: Ditt tal görs om till ett textutkast.
        UILaunchScreen: {}
        # Filnamnen i paketets resursrot. PostScript-namnen, som
        # Font.custom frågar efter, står i Archivo-uppräkningen i
        # TechRabbit.swift och är avlästa ur filernas egna name-tabeller.
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Archivo-Black.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: RostsvarMessages
        embed: true
      - target: RostsvarKeyboard
        embed: true
    scheme:
      testTargets:
        - RostsvarTests
  RostsvarMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - Messages
      # Dikteringen är delad med tangentbordet, så rättningen av den gäller
      # båda tilläggen.
      - path: Shared/Dictation.swift
      - path: Shared/Palette.swift
      - path: Shared/Notice.swift
      - path: Shared/Theme.swift
      - path: Shared/Haptics.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techrabbit.tapntalk.Messages
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Messages/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  RostsvarKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: Shared/Dictation.swift
      - path: Shared/Palette.swift
      - path: Shared/Notice.swift
      # Reglerna för hur tangentbordet skriver i andras fält, skilda från
      # tangentbordet för att kunna mätas av testerna.
      - path: Shared/Proxy.swift
      - path: Shared/Theme.swift
      - path: Shared/Haptics.swift
    settings:
      base:
        # Under appens paket-id, och med com. av samma skäl som i appmålet
        # ovan: med se. blir tangentbordet osynligt i iOS egen lista.
        PRODUCT_BUNDLE_IDENTIFIER: com.techrabbit.tapntalk.Keyboard
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Keyboard/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  RostsvarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Messages/DraftState.swift
      - path: Shared/Dictation.swift
      - path: Shared/Notice.swift
      # Dikteringsskärmens regler ligger skilda från skärmen just för att
      # kunna mätas här. Filen drar in Foundation och ingenting annat.
      - path: App/HomeState.swift
      - path: Shared/Proxy.swift
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.techrabbit.tapntalk.Tests
