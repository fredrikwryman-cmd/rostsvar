<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"><style>body{margin:0;background:#E7E8EA;-webkit-font-smoothing:antialiased}a{color:#1CF038}a:hover{color:#F2F2F2}</style></helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;padding:40px;box-sizing:border-box;font-family:'Archivo',system-ui,sans-serif">
<div data-screen-label="Tap &amp; Talk live" style="position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#0B0B0B;color:#F2F2F2;box-shadow:0 0 0 11px #111111,0 0 0 12.5px #9A9A9A,0 40px 80px rgba(0,0,0,0.25)">
<svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#1CF038" stop-opacity="0"></stop><stop offset="1" stop-color="#1CF038" stop-opacity="0.16"></stop></linearGradient><linearGradient id="lg2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1C1C" stop-opacity="0.9"></stop><stop offset="1" stop-color="#1C1C1C" stop-opacity="0"></stop></linearGradient><radialGradient id="lg3" cx="195" cy="700" r="230" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1CF038" stop-opacity="0.22"></stop><stop offset="1" stop-color="#1CF038" stop-opacity="0"></stop></radialGradient></defs><path d="M0 0 H390 V250 C 320 330, 230 300, 170 210 C 120 130, 70 50, 0 30 Z" fill="url(#lg2)"></path><path d="M390 300 C 290 380, 300 540, 190 640 C 120 700, 50 750, 0 844 H390 Z" fill="url(#lg1)"></path><path d="M390 300 C 290 380, 300 540, 190 640 C 120 700, 50 750, 0 844" fill="none" stroke="#2A2A2A" stroke-width="1.5"></path><rect width="390" height="844" fill="url(#lg3)"></rect></svg>
<div style="position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 46px;box-sizing:border-box;z-index:3"><span style="font-family:-apple-system,system-ui,sans-serif;font-weight:600;font-size:17px">03:20</span><div style="position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000000"></div><div style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"></rect></svg></div></div>
<div style="position:absolute;top:54px;left:0;right:0;bottom:34px;padding:0 20px;display:flex;flex-direction:column;z-index:1">
<div style="height:56px;display:flex;align-items:center;gap:12px;margin-top:6px">
<div style="width:40px;height:40px;border-radius:20px;background:#1A1A1A;border:1.5px solid #1CF038;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F2F2F2"><path d="M9.2 10.5C8 8.6 7.6 5.3 8.1 3.6c.4-1.1 1.6-1.1 1.9 0 .5 1.6.3 4.6-.3 6.9zM14.8 10.5c1.2-1.9 1.6-5.2 1.1-6.9-.4-1.1-1.6-1.1-1.9 0-.5 1.6-.3 4.6.3 6.9z"></path><ellipse cx="12" cy="15" rx="4.6" ry="4.3"></ellipse></svg></div>
<div style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-weight:900;font-size:28px;line-height:32px;letter-spacing:-0.5px">Tap &amp; Talk</span><span style="font-size:12px;font-weight:700;letter-spacing:0.6px;color:#1CF038">TECH RABBIT</span></div>
<div style="height:38px;padding:0 14px;border-radius:19px;background:#1A1A1A;border:1px solid #2E2E2E;display:flex;align-items:center;font-size:14px;font-weight:700">Guide</div>
<div style="height:38px;padding:0 14px;border-radius:19px;background:#1A1A1A;border:1px solid #2E2E2E;display:flex;align-items:center;font-size:14px;font-weight:700">Om</div>
</div>
<p style="margin:14px 2px 0;font-size:15px;line-height:21px;color:#A8A8A8;text-wrap:pretty">Tryck på Tala och diktera. Du läser texten och väljer själv var den skickas.</p>
<div style="margin-top:16px;flex:1;border-radius:22px;background:rgba(26,26,26,0.92);border:1.5px solid {{ fieldBorder }};padding:18px 18px 14px;display:flex;flex-direction:column;min-height:0;transition:border-color 200ms">
<span style="font-size:17px;line-height:25px;color:{{ textColor }}">{{ shownText }}<sc-if value="{{ showCaret }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;width:2px;height:20px;background:#1CF038;vertical-align:-3px;margin-left:2px;opacity:{{ caretOp }}"></span></sc-if></span>
<div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#8A8A8A"><span style="display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:3px;background:{{ dotColor }}"></span><span style="color:{{ statusColor }};font-weight:700">{{ status }}</span></span><span>{{ count }} tecken</span></div>
</div>
<div style="margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px">
<div style="position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center">
<span style="position:absolute;inset:0;border-radius:66px;border:1.5px solid {{ ringColor }};transform:scale({{ r1s }});opacity:{{ r1o }}"></span>
<span style="position:absolute;inset:12px;border-radius:54px;border:1.5px solid {{ ringColor }};transform:scale({{ r2s }});opacity:{{ r2o }}"></span>
<div role="button" aria-label="{{ btnLabel }}" onClick="{{ toggle }}" style="width:88px;height:88px;border-radius:44px;background:{{ btnBg }};display:flex;align-items:center;justify-content:center;box-shadow:0 0 36px {{ btnGlow }};cursor:pointer;transition:background 200ms">
<sc-if value="{{ idleIcon }}" hint-placeholder-val="{{ true }}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></sc-if>
<sc-if value="{{ listening }}" hint-placeholder-val="{{ false }}"><span style="width:28px;height:28px;border-radius:7px;background:#FFFFFF"></span></sc-if>
</div>
</div>
<span style="font-weight:800;font-size:17px">{{ btnLabel }}</span>
</div>
<div style="margin-top:16px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div onClick="{{ clear }}" style="height:52px;border-radius:26px;background:#1A1A1A;border:1px solid {{ secBorder }};color:{{ secColor }};display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;cursor:pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>Rensa</div>
<div style="height:52px;border-radius:26px;background:{{ sendBg }};border:1px solid {{ sendBorder }};color:{{ sendColor }};display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2-6z"></path></svg>Skicka</div>
</div>
</div>
<div style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#F2F2F2;z-index:5"></div>
</div>
<div style="font-size:13px;color:#5A5A5A">Spelas automatiskt: vila → lyssnar → klar → rensa. Tryck på knappen för att styra själv.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { phase: 'idle', t0: 0, now: 0, auto: true };
  txt = 'Hej, jag är på väg och är framme om tjugo minuter. Kan du ta med mjölk och bröd?';
  componentDidMount() { this.go('idle'); const loop = () => { this.raf = requestAnimationFrame(loop); this.tick(); }; loop(); }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  go(phase) { const n = performance.now(); this.setState({ phase, t0: n, now: n }); }
  tick() {
    const n = performance.now(), { phase, t0, auto } = this.state, e = n - t0;
    if (auto) {
      if (phase === 'idle' && e > 2200) return this.go('listen');
      if (phase === 'listen' && e > 5600) return this.go('done');
      if (phase === 'done' && e > 3200) return this.go('idle');
    }
    this.setState({ now: n });
  }
  renderVals() {
    const { phase, t0, now } = this.state, e = now - t0;
    const L = phase === 'listen', D = phase === 'done';
    const words = this.txt.split(' ');
    let shown = '';
    if (L) shown = words.slice(0, Math.min(words.length, Math.floor(e / 260))).join(' ');
    if (D) shown = this.txt;
    const has = shown.length > 0;
    const per = L ? 1600 : 2800, amp = L ? 0.35 : 0.22;
    const p = (off) => ((now / per + off) % 1);
    const p1 = p(0), p2 = p(0.5);
    const breathe = phase === 'idle' ? (0.35 + 0.15 * Math.sin(now / 2800 * Math.PI * 2)) : 0.45;
    return {
      shownText: has ? shown : 'Texten du dikterar hamnar här. Du kan rätta den för hand.',
      textColor: has ? '#F2F2F2' : '#8A8A8A',
      showCaret: L, caretOp: Math.floor(now / 450) % 2 ? 1 : 0.25,
      fieldBorder: L ? '#1CF038' : '#2E2E2E',
      status: L ? 'Lyssnar…' : D ? 'Klar' : 'Redo',
      statusColor: L ? '#1CF038' : '#8A8A8A', dotColor: L ? '#1CF038' : D ? '#A8A8A8' : '#4A4A4A',
      count: shown.length,
      ringColor: L ? 'rgba(224,88,62,0.7)' : 'rgba(28,240,56,0.45)',
      r1s: (1 + p1 * amp).toFixed(3), r1o: ((1 - p1) * (L ? 1 : 0.8)).toFixed(3),
      r2s: (1 + p2 * amp).toFixed(3), r2o: ((1 - p2) * (L ? 1 : 0.8)).toFixed(3),
      btnBg: L ? '#E0583E' : '#1CF038', btnGlow: L ? 'rgba(224,88,62,0.45)' : 'rgba(28,240,56,' + breathe.toFixed(3) + ')',
      btnLabel: L ? 'Stoppa' : 'Tala', idleIcon: !L, listening: L,
      secBorder: D ? '#4A4A4A' : '#2E2E2E', secColor: D ? '#F2F2F2' : '#5A5A5A',
      sendBg: D ? '#1CF038' : '#1A1A1A', sendBorder: D ? '#1CF038' : '#2E2E2E', sendColor: D ? '#0B0B0B' : '#5A5A5A',
      toggle: () => { this.setState({ auto: false }); this.go(L ? 'done' : 'listen'); },
      clear: () => { this.setState({ auto: false }); this.go('idle'); }
    };
  }
}
</script>
</body>
</html>
